<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Love Letter</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Dancing+Script:wght@400;600;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      display: block;
      background: #000;
      min-height: 100vh;
      font-family: 'Dancing Script', cursive;
      overflow-x: hidden;
    }

    .scene {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(ellipse at 50% 30%, #2a0a1a 0%, #0d0008 60%, #000 100%);
      border-radius: 0;
      position: relative;
      overflow: hidden;
      padding: 2rem 1rem 3rem;
    }

    .particles {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .p {
      position: absolute;
      width: 3px;
      height: 3px;
      border-radius: 50%;
      background: #ff6b9d;
      opacity: 0;
      animation: floatUp var(--dur, 6s) linear var(--delay, 0s) infinite;
      left: var(--x, 50%);
    }

    @keyframes floatUp {
      0% { transform: translateY(100px) scale(0); opacity: 0; }
      10% { opacity: 0.8; }
      90% { opacity: 0.4; }
      100% { transform: translateY(-500px) scale(0.5); opacity: 0; }
    }

    .envelope-wrapper {
      position: relative;
      perspective: 800px;
      margin-bottom: 2rem;
      width: 100%;
      max-width: 340px;
      display: flex;
      justify-content: center;
    }

    .envelope {
      position: relative;
      width: 300px;
      height: 200px;
      cursor: pointer;
      transform-style: preserve-3d;
      transition: transform 0.3s ease;
      filter: drop-shadow(0 20px 40px rgba(255,30,100,0.4));
    }

    .envelope:hover {
      transform: translateY(-4px);
      filter: drop-shadow(0 28px 50px rgba(255,30,100,0.55));
    }

    .env-body {
      position: absolute;
      inset: 0;
      background: linear-gradient(160deg, #c0152f 0%, #8b0020 100%);
      border-radius: 4px 4px 8px 8px;
      overflow: hidden;
    }

    .env-body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(255,255,255,0.08) 0%, transparent 50%);
    }

    .env-pocket-left {
      position: absolute;
      bottom: 0; left: 0;
      width: 0; height: 0;
      border-left: 150px solid #a01228;
      border-top: 100px solid transparent;
      border-radius: 0 0 0 8px;
    }

    .env-pocket-right {
      position: absolute;
      bottom: 0; right: 0;
      width: 0; height: 0;
      border-right: 150px solid #a01228;
      border-top: 100px solid transparent;
      border-radius: 0 0 8px 0;
    }

    .env-pocket-bottom {
      position: absolute;
      bottom: 0;
      left: 0; right: 0;
      height: 90px;
      background: linear-gradient(180deg, transparent 0%, #7a0018 100%);
      border-radius: 0 0 8px 8px;
      clip-path: polygon(0 40px, 50% 0%, 100% 40px, 100% 100%, 0 100%);
    }

    .flap {
      position: absolute;
      top: 0; left: 0;
      width: 0; height: 0;
      border-left: 150px solid transparent;
      border-right: 150px solid transparent;
      border-top: 105px solid #d01535;
      transform-origin: top center;
      z-index: 10;
      transition: transform 0.5s cubic-bezier(0.4, 0, 0.2, 1), filter 0.5s;
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.4));
    }

    .flap.open {
      transform: rotateX(180deg);
      filter: drop-shadow(0 -4px 12px rgba(0,0,0,0.5));
      z-index: 1;
    }

    .wax-seal {
      position: absolute;
      top: 42px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 12;
      transition: opacity 0.3s, transform 0.3s;
    }

    .wax-seal svg {
      width: 44px;
      height: 44px;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.5));
    }

    .wax-seal.open {
      opacity: 0;
      transform: translateX(-50%) scale(0.6);
      pointer-events: none;
    }

    .letter {
      position: absolute;
      width: 86%;
      left: 7%;
      height: 88%;
      top: 6%;
      background: #fffef8;
      border-radius: 4px;
      z-index: 2;
      transform: translateY(0px);
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.3s, z-index 0.1s 0.3s;
      overflow: hidden;
      box-shadow: inset 0 0 30px rgba(255,200,200,0.15);
      opacity: 0;
      pointer-events: none;
    }

    .letter.open {
      transform: translateY(-115px);
      z-index: 5;
      transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1) 0.35s;
      opacity: 1;
      pointer-events: auto;
    }

    .letter::before {
      content: '';
      position: absolute;
      inset: 0;
      background: repeating-linear-gradient(transparent, transparent 22px, rgba(255,150,150,0.12) 22px, rgba(255,150,150,0.12) 23px);
      pointer-events: none;
    }

    .letter-inner {
      padding: 12px 14px;
      font-family: 'Dancing Script', cursive;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .to-line {
      font-size: 11px;
      color: #c05070;
      font-weight: 600;
      letter-spacing: 0.5px;
    }

    .letter-line {
      font-size: 13px;
      color: #6b1a2a;
      line-height: 1.4;
    }

    .letter-line.main {
      font-size: 14px;
      font-weight: 600;
      color: #8b0020;
      margin-top: 2px;
    }

    .heart-container {
      position: absolute;
      bottom: 0;
      left: 0; right: 0;
      pointer-events: none;
      z-index: 20;
      height: 0;
    }

    .fheart {
      position: absolute;
      bottom: 0;
      opacity: 0;
      transform-origin: center bottom;
    }

    .fheart svg {
      display: block;
    }

    @keyframes heartFloat {
      0%   { opacity: 0; transform: translateY(0) scale(0.4) rotate(var(--rot,-5deg)); }
      10%  { opacity: 1; }
      80%  { opacity: 0.7; }
      100% { opacity: 0; transform: translateY(-420px) scale(var(--sc,1)) rotate(var(--rot2, 10deg)); }
    }

    @keyframes sway {
      0%, 100% { margin-left: 0; }
      50% { margin-left: var(--sw, 30px); }
    }

    .fheart.animate {
      animation: heartFloat var(--dur2, 4s) ease-in-out forwards, sway var(--sw-dur, 2s) ease-in-out infinite;
      animation-delay: var(--hdelay, 0s), var(--hdelay, 0s);
    }

    .btn-row {
      display: flex;
      gap: 12px;
      z-index: 30;
      flex-wrap: wrap;
      justify-content: center;
    }

    .btn {
      font-family: 'Dancing Script', cursive;
      font-size: 16px;
      font-weight: 600;
      padding: 10px 28px;
      border-radius: 50px;
      border: 2px solid rgba(255,100,130,0.6);
      background: rgba(255,30,80,0.12);
      color: #ffb0c0;
      cursor: pointer;
      transition: all 0.2s ease;
      backdrop-filter: blur(8px);
      letter-spacing: 0.5px;
      -webkit-tap-highlight-color: transparent;
    }

    .btn:hover {
      background: rgba(255,30,80,0.3);
      border-color: rgba(255,100,130,0.9);
      color: #fff;
      transform: translateY(-2px);
      box-shadow: 0 6px 20px rgba(255,30,80,0.3);
    }

    .btn:active { transform: translateY(0); }

    .tagline {
      font-family: 'Dancing Script', cursive;
      color: rgba(255,180,200,0.6);
      font-size: 13px;
      margin-top: 4px;
      letter-spacing: 1px;
      text-align: center;
    }

    .footer {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      z-index: 100;
      background: rgba(13, 0, 8, 0.85);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-top: 1px solid rgba(255, 100, 130, 0.2);
      padding: 10px 16px;
      text-align: center;
      font-family: 'Dancing Script', cursive;
      color: rgba(255, 180, 200, 0.7);
      font-size: 12px;
      letter-spacing: 1px;
    }

    .footer .heart-icon {
      color: #ff6b9d;
      display: inline-block;
      animation: pulseGlow 2s ease-in-out infinite;
    }

    @keyframes pulseGlow {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }

    /* Mobile responsiveness */
    @media (max-width: 480px) {
      .scene {
        padding: 1.5rem 0.5rem 5rem;
        min-height: 100vh;
        justify-content: flex-start;
        padding-top: 15vh;
      }

      .envelope {
        width: 260px;
        height: 174px;
      }

      .env-pocket-left {
        border-left: 130px solid #a01228;
        border-top: 87px solid transparent;
      }

      .env-pocket-right {
        border-right: 130px solid #a01228;
        border-top: 87px solid transparent;
      }

      .env-pocket-bottom {
        height: 78px;
        clip-path: polygon(0 35px, 50% 0%, 100% 35px, 100% 100%, 0 100%);
      }

      .flap {
        border-left: 130px solid transparent;
        border-right: 130px solid transparent;
        border-top: 91px solid #d01535;
      }

      .wax-seal {
        top: 36px;
      }

      .wax-seal svg {
        width: 38px;
        height: 38px;
      }

      .letter.open {
        transform: translateY(-100px);
      }

      .letter-inner {
        padding: 10px 12px;
        gap: 4px;
      }

      .to-line {
        font-size: 10px;
      }

      .letter-line {
        font-size: 12px;
      }

      .letter-line.main {
        font-size: 13px;
      }

      .btn {
        font-size: 15px;
        padding: 9px 24px;
      }

      .tagline {
        font-size: 12px;
      }

      .footer {
        font-size: 11px;
        padding: 8px 12px;
      }
    }

    @media (max-width: 360px) {
      .envelope {
        width: 220px;
        height: 147px;
      }

      .env-pocket-left {
        border-left: 110px solid #a01228;
        border-top: 74px solid transparent;
      }

      .env-pocket-right {
        border-right: 110px solid #a01228;
        border-top: 74px solid transparent;
      }

      .env-pocket-bottom {
        height: 66px;
        clip-path: polygon(0 30px, 50% 0%, 100% 30px, 100% 100%, 0 100%);
      }

      .flap {
        border-left: 110px solid transparent;
        border-right: 110px solid transparent;
        border-top: 77px solid #d01535;
      }

      .wax-seal {
        top: 30px;
      }

      .wax-seal svg {
        width: 32px;
        height: 32px;
      }

      .letter.open {
        transform: translateY(-85px);
      }
    }
  </style>
<base target="_blank">
</head>
<body>
  <div class="scene" id="scene">
    <div class="particles" id="particles"></div>

    <div class="envelope-wrapper">
      <div class="envelope" id="envelope" onclick="toggleEnvelope()">
        <div class="env-body"></div>
        <div class="env-pocket-left"></div>
        <div class="env-pocket-right"></div>
        <div class="env-pocket-bottom"></div>

        <div class="letter" id="letter">
          <div class="letter-inner">
            <div class="to-line">✦ To: Crush ✦</div>
            <div class="letter-line main">Dear crush,</div>
            <div class="letter-line">I tawnah Vala Lu a hai</div>
            <div class="letter-line">I tello chuan ser mu pawh a al</div>
            <div class="letter-line">Hmarcha te hi a thak lo re2,</div>
            <div class="letter-line" style="margin-top:6px; color:#c0405a; font-size:15px;">— with love❤️</div>
          </div>
        </div>

        <div class="flap" id="flap"></div>

        <div class="wax-seal" id="waxSeal">
          <svg viewBox="0 0 44 44" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="22" cy="22" r="20" fill="#8b0020" stroke="#ff6b6b" stroke-width="1.5"/>
            <circle cx="22" cy="22" r="15" fill="none" stroke="#ff6b6b" stroke-width="0.8" stroke-dasharray="2 2"/>
            <text x="22" y="27" text-anchor="middle" font-family="serif" font-size="14" fill="#ffb0b0">♥</text>
          </svg>
        </div>
      </div>

      <div class="heart-container" id="hearts"></div>
    </div>

    <div class="btn-row">
      <button class="btn" onclick="openEnvelope()">Open ✦</button>
      <button class="btn" onclick="closeEnvelope()">Close</button>
    </div>
    <div class="tagline">click the envelope or use the buttons</div>
  </div>

  <div class="footer">
    <span class="heart-icon">♥</span> Made with love By Tej Chinzah <span class="heart-icon">♥</span>
  </div>

  <script>
    let isOpen = false;

    const heartColors = ['#ff6b9d','#ff4d7a','#ff85b3','#e91e63','#f48fb1','#ff1744'];

    function makeParticles() {
      const container = document.getElementById('particles');
      for (let i = 0; i < 18; i++) {
        const p = document.createElement('div');
        p.className = 'p';
        const dur = 5 + Math.random() * 7;
        const delay = Math.random() * 8;
        const x = Math.random() * 100;
        const size = 1.5 + Math.random() * 3;
        p.style.cssText = `--dur:${dur}s;--delay:${delay}s;--x:${x}%;width:${size}px;height:${size}px;background:${heartColors[Math.floor(Math.random()*heartColors.length)]};`;
        container.appendChild(p);
      }
    }

    function spawnHearts() {
      const container = document.getElementById('hearts');
      container.innerHTML = '';
      const configs = [
        { x: '18%', sc: 0.55, dur: 4.2, delay: 0.5, sw: 28, swDur: 1.8, rot: '-8deg', rot2: '12deg' },
        { x: '55%', sc: 0.9,  dur: 5.5, delay: 0.6, sw: -22, swDur: 2.5, rot: '5deg', rot2: '-15deg' },
        { x: '8%',  sc: 0.7,  dur: 6.8, delay: 0.8, sw: 35, swDur: 2.0, rot: '-3deg', rot2: '20deg' },
        { x: '72%', sc: 0.45, dur: 3.8, delay: 0.9, sw: -18, swDur: 1.5, rot: '10deg', rot2: '-8deg' },
        { x: '40%', sc: 0.6,  dur: 5.0, delay: 1.1, sw: 20, swDur: 2.2, rot: '-12deg', rot2: '5deg' },
      ];
      configs.forEach(c => {
        const h = document.createElement('div');
        h.className = 'fheart';
        const col = heartColors[Math.floor(Math.random()*heartColors.length)];
        h.innerHTML = `<svg width="40" height="36" viewBox="0 0 40 36" fill="${col}" xmlns="http://www.w3.org/2000/svg"><path d="M20 34 C20 34 2 22 2 11 C2 5.477 6.477 1 12 1 C15.314 1 18.236 2.628 20 5.14 C21.764 2.628 24.686 1 28 1 C33.523 1 38 5.477 38 11 C38 22 20 34 20 34Z"/></svg>`;
        h.style.cssText = `left:${c.x};--rot:${c.rot};--rot2:${c.rot2};--sc:${c.sc};--dur2:${c.dur}s;--hdelay:${c.delay}s;--sw:${c.sw}px;--sw-dur:${c.swDur}s;`;
        container.appendChild(h);
        requestAnimationFrame(() => requestAnimationFrame(() => h.classList.add('animate')));
      });
    }

    function openEnvelope() {
      if (isOpen) return;
      isOpen = true;
      document.getElementById('flap').classList.add('open');
      document.getElementById('waxSeal').classList.add('open');
      setTimeout(() => document.getElementById('letter').classList.add('open'), 300);
      setTimeout(spawnHearts, 500);
    }

    function closeEnvelope() {
      if (!isOpen) return;
      isOpen = false;
      document.getElementById('letter').classList.remove('open');
      document.getElementById('hearts').innerHTML = '';
      setTimeout(() => {
        document.getElementById('flap').classList.remove('open');
        document.getElementById('waxSeal').classList.remove('open');
      }, 200);
    }

    function toggleEnvelope() {
      isOpen ? closeEnvelope() : openEnvelope();
    }

    makeParticles();
  </script>
</body>
</html>
